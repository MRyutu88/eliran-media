<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>אלירן · שיתוף</title>
<!-- The share page (docs/news_system.md, "דף שיתוף"). It lives on GitHub Pages (public repo eliran-media), a real
     top-level https page, so navigator.share({files}) is allowed here (unlike inside the claude.ai frame).
     The newsroom opens it as share.html#f=<file path in the repo>&app=Instagram&pick=Stories&c=<text to copy>.
     The file is fetched as soon as the page loads, so the tap on "share" calls navigator.share with no await before it
     (the browser only allows it straight from a tap). -->
<style>
  :root { --bg: #14121a; --fg: #f4f1ea; --dim: #a9a3b4; --card: #221f2b; --accent: #ffd23f; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Segoe UI", Arial, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 20px; margin: 4px 0 0; }
  .pick { color: var(--dim); margin: 0; }
  .media { background: var(--card); border-radius: 14px; overflow: hidden; display: flex; justify-content: center; }
  .media img, .media video { display: block; max-width: 100%; max-height: 58vh; }
  button, a.btn { font: inherit; border: 0; border-radius: 12px; padding: 14px; cursor: pointer; text-align: center; text-decoration: none; }
  #go { background: var(--accent); color: #14121a; font-size: 19px; font-weight: 700; }
  #go:disabled { opacity: .45; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; background: var(--card); color: var(--fg); }
  .copy { background: var(--card); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  .copy span { flex: 1; overflow-wrap: anywhere; font-size: 14px; direction: auto; unicode-bidi: plaintext; }
  .copy button { background: #353042; color: var(--fg); padding: 8px 12px; }
  #msg { min-height: 1.5em; margin: 0; }
  #msg.bad { color: var(--bad); }
  details { color: var(--dim); font-size: 12px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; }
</style>
</head>
<body>
<main>
  <h1 id="title">שיתוף</h1>
  <p class="pick" id="pick"></p>
  <div class="media" id="media"></div>
  <button id="go" disabled>טוען את הקובץ…</button>
  <p id="msg"></p>
  <div class="copy" id="copyBox" hidden><span id="copyText"></span><button id="copy">העתק</button></div>
  <div class="row"><a class="btn" id="save" download>שמור את הקובץ</a></div>
  <details><summary>פרטים טכניים</summary><pre id="diag"></pre></details>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  const src = q.get("f") || "", app = q.get("app") || "Instagram", pick = q.get("pick") || "Stories", copy = q.get("c") || "";
  const name = (src.split("/").pop() || "eliran").split("?")[0];
  const isVideo = /\.(mp4|mov|webm)$/i.test(name);
  const say = (t, bad) => { $("msg").textContent = t; $("msg").className = bad ? "bad" : ""; };
  const diag = { ua: navigator.userAgent, share: typeof navigator.share, canShare: "?", file: src };
  const showDiag = () => { $("diag").textContent = JSON.stringify(diag, null, 1); };

  $("title").textContent = "שתף ל-" + app + (pick ? " · " + pick : "");
  $("pick").textContent = "בחלון השיתוף בחרו " + app + (pick ? " ← \"" + pick + "\"" : "") + ". העורך של האפליקציה ייפתח עם הקובץ.";
  if (copy) {
    $("copyBox").hidden = false; $("copyText").textContent = copy;
    $("copy").onclick = () => navigator.clipboard.writeText(copy).then(() => say("הועתק."), () => say("ההעתקה לא עבדה. סמנו את הטקסט והעתיקו.", true));
  }
  // Relative paths only: the page shares files of its own repo, never a URL someone put in the link
  if (!src || /^[a-z]+:|^\/\//i.test(src) || src.includes("..")) { $("go").textContent = "אין קובץ"; say("בקישור אין קובץ לשיתוף.", true); showDiag(); return; }

  const el = document.createElement(isVideo ? "video" : "img");
  el.src = src; if (isVideo) { el.controls = true; el.playsInline = true; el.muted = true; } else el.alt = "";
  $("media").appendChild(el);
  $("save").href = src; $("save").download = name;

  let file = null;
  fetch(src).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); }).then(b => {
    file = new File([b], name, { type: b.type || (isVideo ? "video/mp4" : "image/png") });
    let can = false; try { can = !!navigator.canShare?.({ files: [file] }); } catch (e) { diag.canShareError = String(e); }
    diag.canShare = can; diag.size = file.size; diag.type = file.type; showDiag();
    if (can) { $("go").disabled = false; $("go").textContent = "שתף ל-" + app; }
    else { $("go").textContent = "חלון השיתוף לא זמין כאן"; say("הדפדפן הזה לא משתף קבצים. שמרו את הקובץ ושתפו מהגלריה, או נסו ב-Chrome בטלפון.", true); }
  }).catch(e => { diag.fetchError = String(e); showDiag(); $("go").textContent = "הקובץ לא נטען"; say("הקובץ לא נטען (" + e.message + ").", true); });
  showDiag();

  // Straight from the tap: nothing awaited before share()
  $("go").onclick = () => {
    if (!file) return;
    navigator.share({ files: [file] }).then(() => { diag.result = "shared"; showDiag(); say("נשלח ל-" + app + ". פרסמו שם, ואז חזרו לחדר החדשות וסמנו ✓."); },
      e => { diag.result = e && e.name; showDiag(); if (e && e.name === "AbortError") return; say("חלון השיתוף נכשל (" + (e && e.name) + "). שמרו את הקובץ ושתפו מהגלריה.", true); });
  };
})();
</script>
</body>
</html>
