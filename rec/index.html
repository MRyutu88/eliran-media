<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16101C">
<link rel="icon" href="data:,">
<title>אלירן · הקלטה</title>
<!-- Phone recording page (docs/phone_recording.md). GitHub Pages of the public repo eliran-media: only code lives here.
     The VRM is picked from the phone and kept in this browser's IndexedDB; it is never uploaded anywhere.
     three.js + three-vrm render the model, MediaPipe Face Landmarker tracks the front camera, MediaRecorder records
     the canvas + the microphone, and each take also keeps a performance file (take.js) that "נגן מחדש" replays.
     "ערוך" opens a timeline editor on a take (editor.js) and renders it offline to MP4 (WebCodecs + mp4-muxer).
     Versions are pinned; bump them together and re-test. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js",
  "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/vision_bundle.mjs",
  "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.mjs"
} }
</script>
<style>
  :root { --ink: #16101C; --plum: #5B2140; --card: #241a2c; --line: #3a2c45; --cream: #FFF6EE; --dim: #b9adc4;
          --raspberry: #E8456B; --hot: #FFD23F; --ok: #A6E35A; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--cream);
               font: 16px/1.4 system-ui, "Segoe UI", Arial, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 40px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; white-space: nowrap; }
  #fps { margin-inline-start: auto; direction: ltr; font: 11px/1.3 ui-monospace, Consolas, monospace; color: var(--dim);
         overflow: hidden; text-overflow: ellipsis; min-width: 0;
         background: var(--card); border-radius: 8px; padding: 3px 8px; white-space: nowrap; }
  #fps b { color: var(--cream); font-weight: 600; }
  #fps .warn { color: var(--hot); } #fps .bad { color: var(--raspberry); }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; padding: 0 8px; }
  #view { height: 100%; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 14px; background: var(--plum); display: block; }
  #cam { position: absolute; top: 8px; inset-inline-end: 16px; width: 26%; max-width: 140px; border-radius: 10px;
         transform: scaleX(-1); border: 2px solid var(--line); background: #000; }
  #rec-dot { position: absolute; top: 14px; inset-inline-start: 18px; background: var(--raspberry); color: #fff; font-weight: 700;
             border-radius: 999px; padding: 4px 12px; font-size: 15px; }
  #status { position: absolute; inset-inline: 24px; bottom: 16px; text-align: center; background: rgba(22,16,28,.82);
            border-radius: 12px; padding: 10px 12px; font-size: 15px; }
  #status.bad { color: var(--raspberry); }
  .controls { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  button, .btn { font: inherit; border: 0; border-radius: 12px; padding: 13px 14px; cursor: pointer; text-align: center;
                 text-decoration: none; color: var(--cream); background: var(--card); }
  button:disabled { opacity: .45; }
  .main { background: var(--hot); color: var(--ink); font-size: 19px; font-weight: 700; padding: 15px; }
  .main.rec { background: var(--raspberry); color: #fff; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chips button { flex: none; padding: 8px 12px; font-size: 14px; border: 1px solid var(--line); background: transparent; }
  .chips button[aria-pressed="true"] { background: var(--card); border-color: var(--hot); }
  .hint { color: var(--dim); font-size: 14px; margin: 0; text-align: center; }
  /* result sheet */
  #result { position: fixed; inset: 0; background: rgba(10,7,14,.96); display: flex; flex-direction: column; gap: 10px;
            padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); z-index: 5; }
  #result video { flex: 1; min-height: 0; width: 100%; object-fit: contain; border-radius: 12px; background: #000; }
  #result .meta { color: var(--dim); font-size: 13px; text-align: center; direction: rtl; }
  #pick-input { display: none; }
  .chips button.danger { color: var(--raspberry); }
  #rec-dot { direction: ltr; }
  /* takes list */
  #takes { position: fixed; inset: 0; background: rgba(10,7,14,.97); display: flex; flex-direction: column; gap: 10px;
           padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); z-index: 6; }
  #takes header { padding: 0; }
  #takes-close { margin-inline-start: auto; padding: 8px 14px; }
  #takes-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  #takes-list li { background: var(--card); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  #takes-list li span { display: block; color: var(--dim); font-size: 14px; }
  #takes-list .chips { justify-content: flex-start; }
  /* replay bar */
  #replay-bar { display: flex; flex-direction: column; gap: 8px; }
  #rp-title { margin: 0; text-align: center; font-weight: 600; }
  /* editor (editor.js): Eliran on top, three strips, the panel of the selected block */
  body.editing .controls, body.editing #cam, body.editing #status:empty { display: none; }
  #editor { padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  .ed-bar { display: flex; align-items: center; gap: 6px; }
  .ed-bar button { padding: 8px 12px; font-size: 15px; }
  #ed-play { background: var(--hot); color: var(--ink); font-weight: 700; min-width: 52px; }
  #ed-time { direction: ltr; font: 13px ui-monospace, Consolas, monospace; color: var(--dim); }
  #ed-title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  #ed-tl { position: relative; height: 122px; overflow: hidden; background: #110c16; border-radius: 10px; touch-action: none;
           user-select: none; -webkit-user-select: none; }
  #ed-content { position: absolute; top: 0; bottom: 0; right: 50%; will-change: transform; z-index: 1; }
  .ed-ruler { position: absolute; top: 0; height: 18px; left: 0; right: 0; }
  .ed-ruler span { position: absolute; top: 0; height: 18px; border-right: 1px solid var(--line); padding-right: 3px;
                   font: 10px/18px ui-monospace, Consolas, monospace; color: var(--dim); direction: ltr; }
  .ed-ruler span.half { height: 6px; }
  .ed-row { position: absolute; left: 0; right: 0; height: 32px; background: rgba(58,44,69,.45); border-radius: 6px; }
  .it { position: absolute; top: 3px; bottom: 3px; border-radius: 6px; font-size: 12px; line-height: 26px; padding: 0 6px;
        overflow: hidden; white-space: nowrap; color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .it.sel { outline: 2px solid var(--hot); outline-offset: 1px; z-index: 2; }
  /* the strip names sit under the blocks (shown where a strip is empty) */
  .ed-names { position: absolute; top: 18px; right: 6px; pointer-events: none; display: flex; flex-direction: column; z-index: 0; }
  .ed-names span { height: 34px; line-height: 32px; font-size: 10px; color: var(--dim); }
  #ed-head { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--raspberry); pointer-events: none; z-index: 3; }
  #ed-sheet { background: var(--card); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px;
              max-height: 34vh; overflow-y: auto; }
  .ed-sh-top { display: flex; align-items: center; gap: 6px; }
  .ed-sh-top b { flex: 1; }
  .ed-sh-top button { padding: 6px 10px; font-size: 14px; background: transparent; border: 1px solid var(--line); }
  .ed-field { display: flex; align-items: center; gap: 8px; }
  .ed-field .chips { justify-content: flex-start; flex: 1; }
  .ed-field .chips button { padding: 6px 10px; }
  .ed-lbl2 { font-size: 13px; color: var(--dim); min-width: 62px; }
  .ed-ends { display: flex; align-items: center; gap: 6px; flex: 1; font-size: 12px; color: var(--dim); direction: ltr; }
  .ed-ends input { flex: 1; accent-color: var(--hot); }
  .ed-swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .ed-swatches .sw { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid var(--line); }
  .ed-swatches .sw[aria-pressed="true"] { border-color: var(--hot); box-shadow: 0 0 0 2px var(--ink) inset; }
  #ed-add button { padding: 11px 6px; font-size: 15px; }
  /* render sheet */
  #render { position: fixed; inset: 0; background: rgba(10,7,14,.96); display: flex; flex-direction: column; gap: 12px; justify-content: center;
            padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)); z-index: 8; }
  #render h2 { margin: 0; font-size: 18px; text-align: center; }
  #r-opts { display: flex; flex-direction: column; gap: 10px; }
  #r-note { color: var(--dim); font-size: 14px; margin: 0; }
  #r-bar { background: var(--card); border-radius: 999px; height: 14px; overflow: hidden; }
  #r-fill { background: var(--hot); height: 100%; width: 0; transition: width .2s; }
  #r-text { text-align: center; font-size: 14px; direction: rtl; min-height: 1.4em; margin: 0; }
</style>
</head>
<body>
<header>
  <h1>אלירן · הקלטה</h1>
  <div id="fps" aria-live="off">—</div>
</header>

<div class="stage">
  <canvas id="view" width="720" height="1280"></canvas>
  <video id="cam" playsinline muted hidden></video>
  <div id="rec-dot" hidden>● 0:00</div>
  <div id="status" role="status">טוען…</div>
</div>

<div class="controls">
  <input id="pick-input" type="file" accept=".vrm,model/gltf-binary,application/octet-stream">
  <button id="pick" class="main" hidden>בחר קובץ VRM מהטלפון</button>
  <button id="start" class="main" hidden>הפעל מצלמה ומיקרופון</button>
  <button id="record" class="main" hidden>● התחל הקלטה</button>
  <div id="replay-bar" hidden>
    <p id="rp-title">▶ מנגן מחדש</p>
    <div class="row">
      <button id="rp-rec" class="main">● הקלט לוידאו חדש</button>
    </div>
    <div class="row">
      <button id="rp-again">▶ מההתחלה</button>
      <button id="rp-stop">■ חזרה למצלמה</button>
    </div>
  </div>
  <div id="chips" class="chips" hidden>
    <button id="t-mirror" aria-pressed="true">מראה</button>
    <button id="t-cam" aria-pressed="false">הצג מצלמה</button>
    <button id="f-body" aria-pressed="true">מלא</button>
    <button id="f-close" aria-pressed="false">קרוב</button>
    <button id="mic-retry" hidden>🎤 לנסות מיקרופון שוב</button>
    <button id="calib">כייל (פנים רגילות)</button>
    <button id="takes-btn">🎞 הקלטות</button>
    <button id="swap">החלף מודל</button>
  </div>
  <p id="hint" class="hint" hidden></p>
</div>

<div id="editor" hidden>
  <div class="ed-bar">
    <button id="ed-play" aria-label="נגן">▶</button>
    <span id="ed-time">0:00.0</span>
    <span id="ed-title"></span>
    <button id="ed-undo" aria-label="בטל פעולה">↶</button>
    <button id="ed-zout" aria-label="הקטן ציר זמן">−</button>
    <button id="ed-zin" aria-label="הגדל ציר זמן">+</button>
  </div>
  <div id="ed-tl">
    <div id="ed-content"></div>
    <div class="ed-names"><span>מצלמה</span><span>אפקטים</span><span>רקע</span></div>
    <div id="ed-head"></div>
  </div>
  <div id="ed-add" class="row">
    <button id="ed-add-cam">+ מצלמה</button>
    <button id="ed-add-fx">+ אפקט</button>
    <button id="ed-add-bg">+ רקע</button>
  </div>
  <div id="ed-sheet" hidden>
    <div class="ed-sh-top">
      <b id="ed-sh-title"></b>
      <button id="ed-sh-here">⇥ לסמן</button>
      <button id="ed-sh-del" class="danger">🗑</button>
      <button id="ed-sh-ok">✓</button>
    </div>
    <div id="ed-sh-body"></div>
  </div>
  <div class="row">
    <button id="ed-close">✕ סגור</button>
    <button id="ed-render" class="main">🎬 רנדר לוידאו</button>
  </div>
</div>

<div id="render" hidden>
  <h2>🎬 רנדר לוידאו</h2>
  <div id="r-opts"></div>
  <p id="r-note"></p>
  <div id="r-bar" hidden><div id="r-fill"></div></div>
  <p id="r-text"></p>
  <button id="r-go" class="main">התחל רנדר</button>
  <button id="r-cancel">סגור</button>
</div>

<div id="result" hidden>
  <video id="playback" controls playsinline></video>
  <div class="meta" id="meta"></div>
  <div class="row">
    <button id="share" class="main">שתף</button>
    <a id="save" class="btn" download>שמור וידאו</a>
  </div>
  <div class="row">
    <button id="result-edit">✂ ערוך</button>
    <button id="result-replay">↻ נגן מחדש</button>
    <button id="save-perf">שמור קובץ ביצוע</button>
  </div>
  <button id="again">סגור</button>
</div>

<div id="takes" hidden>
  <header><h1>🎞 הקלטות</h1><button id="takes-close">סגור</button></header>
  <p id="takes-note" class="hint"></p>
  <ul id="takes-list"></ul>
</div>

<!-- REC_VERSION: bump it here, in app.js and in every local import ("?v=") on each publish (docs/phone_recording.md,
     "Updates and the phone's cache"). GitHub Pages lets the phone cache each file for 10 minutes; mixed old/new files
     crashed the page on "טוען…" (25.11). -->
<meta name="rec-version" content="4">
<script>
  // Boot guard: if the page code fails to load or crashes before it starts, say so (with a fresh reload) instead of
  // "טוען…" forever.
  (function () {
    function fail(why) {
      if (window.__recBooted || window.__recFailed) return;
      window.__recFailed = true;
      var s = document.getElementById("status");
      if (!s) return;
      s.hidden = false; s.className = "bad";
      s.textContent = "הדף לא נטען (" + why + "). ";
      var b = document.createElement("button");
      b.textContent = "רענן";
      b.style.marginTop = "8px";
      b.onclick = function () { location.replace(location.pathname + "?r=" + Date.now()); };
      s.appendChild(b);
    }
    window.__recBootFail = fail;
    window.addEventListener("error", function (e) { fail((e && e.message) || "שגיאה"); });
    setTimeout(function () { fail("לקח יותר מדי זמן, אולי אין אינטרנט"); }, 40000);
  })();
</script>
<script type="module" src="app.js?v=4" onerror="__recBootFail('קובץ חסר')"></script>
</body>
</html>
